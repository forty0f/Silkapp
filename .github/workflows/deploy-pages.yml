name: Deploy to GitHub Pages

# Production deploys come only from `main`. Development happens on other
# branches and reaches `main` through reviewed pull requests.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job can only read; Pages write and the OIDC
# token are granted to the deploy job alone.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build (base path from Pages, e.g. /Silkapp/)
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SILK_BUILD_ID: ${{ github.sha }}

      - name: Verify build output stays under the base path
        run: |
          set -e
          grep -q "\"${BASE_PATH}sw.js\"" dist/assets/index-*.js
          grep -q "href=\"${BASE_PATH}manifest.webmanifest\"" dist/index.html
          test -f dist/pwa-192.png && test -f dist/pwa-512.png && test -f dist/pwa-512-maskable.png && test -f dist/apple-touch-icon.png
          ! find dist -name '*.map' -o -name '.env*' -o -name 'seed.json' | grep .
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
